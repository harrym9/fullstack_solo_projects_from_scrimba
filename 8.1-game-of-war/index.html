<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of War | Browser Card Game</title>
    <meta name="description" content="Play the classic Game of War card game in your browser against the computer using a live shuffled 52-card deck.">
    <meta name="keywords" content="Game of War, card game, online card game, JavaScript card game, Deck of Cards API, browser game">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1b4d2e">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Game of War | Browser Card Game">
    <meta property="og:description" content="Play the classic Game of War card game in your browser against the computer using a live shuffled 52-card deck.">
    <meta property="og:image" content="images/main.png">
    <meta property="og:image:alt" content="Game of War card game interface showing drawn cards and scores on a green felt table">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Game of War | Browser Card Game">
    <meta name="twitter:description" content="Play the classic Game of War card game in your browser against the computer using a live shuffled 52-card deck.">
    <meta name="twitter:image" content="images/main.png">
    <meta name="twitter:image:alt" content="Game of War card game interface showing drawn cards and scores on a green felt table">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="top">
        <button id="new-deck" type="button">New Deck</button>
        <p id="remaining" aria-live="polite">Click "New Deck" to start</p>
    </header>

    <main class="game-board">
        <h1 id="header" aria-live="polite">Game of War</h1>
        <h2 id="computer-score" class="score">Computer score: 0</h2>

        <div id="cards" class="cards">
            <div class="card-slot" aria-label="Computer card"></div>
            <div class="card-slot" aria-label="Your card"></div>
        </div>

        <h2 id="my-score" class="score">My score: 0</h2>
    </main>

    <footer class="controls">
        <button id="draw-cards" class="draw" type="button" disabled>Draw</button>
    </footer>

    <script src="index.js"></script>
</body>

</html>
