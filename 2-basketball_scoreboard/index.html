<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO Tags -->
    <meta
      name="description"
      content="Interactive digital basketball scoreboard to track Home and Guest team points in real time with +1, +2, and +3 score controls."
    />
    <meta
      name="keywords"
      content="basketball scoreboard, score tracker, sports counter, digital scoreboard, JavaScript project"
    />
    <meta name="author" content="Gayrat Rahmatullayev" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Basketball Scoreboard" />
    <meta
      property="og:description"
      content="Track Home and Guest basketball scores easily with this interactive digital scoreboard."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Basketball Scoreboard" />
    <meta
      name="twitter:description"
      content="Track Home and Guest basketball scores easily with this interactive digital scoreboard."
    />
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://static.vecteezy.com/system/resources/previews/015/180/869/non_2x/basketball-scoreboard-icon-outline-style-vector.jpg"
    />
    <link
      href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="scoreboard">
        <div class="home">
          <h1 class="teams">HOME</h1>
          <div class="score" id="home-score">0</div>
          <div class="buttons">
            <button onclick="addPointToHome(1)">+1</button>
            <button onclick="addPointToHome(2)">+2</button>
            <button onclick="addPointToHome(3)">+3</button>
          </div>
        </div>
        <div>
          <button class="reset-btn" onclick="resetPoints()">Reset</button>
        </div>
        <div class="guest">
          <h1 class="teams">GUEST</h1>
          <div class="score" id="guest-score">0</div>
          <div class="buttons">
            <button onclick="addPointToGuest(1)">+1</button>
            <button onclick="addPointToGuest(2)">+2</button>
            <button onclick="addPointToGuest(3)">+3</button>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
