<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&display=swap"
        rel="stylesheet">
    <!-- Meta: Viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollyGlot: Ai translator buddy</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <div class="header-wrapper">
            <img src="assets/parrot.png" alt="PollyGlot colorful parrot logo" class="logo">
            <h1 class="title"><span class="">PollyGlot</span>Perfect Translation Every Time</h1>
        </div>
    </header>
    <main>
        <div class="main-wrapper">
            <form>
                <label for="input-place" class="form-heading">Text to translate 👇</label>
                <textarea name="input-place" id="input-place" placeholder="Type here..." required></textarea>
                <p class="label-for-div">Select language 👇</p>
                <div class="language-options" id="language-options">
                    <label for="french" class="language">
                        <input type="radio" name="languages" value="french" id="french" checked>
                        <span>French</span>
                        <img src="assets/fr-flag.png" alt="French flag">
                    </label>
                    <label for="spanish" class="language">
                        <input type="radio" name="languages" value="spanish" id="spanish">
                        <span>Spanish</span>
                        <img src="assets/sp-flag.png" alt="Spain flag">
                    </label>
                    <label for="japanese" class="language">
                        <input type="radio" name="languages" value="japanese" id="japanese">
                        <span>Japanese</span>
                        <img src="assets/jpn-flag.png" alt="Japan flag">
                    </label>
                </div>
                <div class="show-translate hidden">
                    <!-- TRANSLATED OUTPUT -->
                </div>
                <input type="submit" value="Translate" id="translate-btn">
            </form>
        </div>
    </main>

    <script src="index.js" type="module"></script>
</body>

</html>
