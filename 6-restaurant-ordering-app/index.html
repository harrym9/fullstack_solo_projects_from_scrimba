<!doctype html>
<html lang="en">

    <!-- SEO Tags -->

      content="Order delicious burgers, pizza, and drinks online with our fast and easy-to-use restaurant ordering app."

  <body>
    <header>
      <h1 class="title">Harry's Dinner</h1>

    <main>
      <div class="menu">
        <!-- js -->
        <div class="menu-item">
          <img
            class="product-image"
            src="assets/images/pizza.png"
            alt="Photo of the Pizza slice for the menu"
          />
          <div class="product-info">
            <h2 class="product-name">Pizza</h2>
            <p class="product-ingredients">pepperoni, mushroom, mozarella</p>
            <p class="product-price">$14</p>
          </div>
          <button class="add-btn">+</button>
        </div>
        <div class="menu-item">
          <img

          />
          <div class="product-info">
            <h2 class="product-name">Pizza</h2>
            <p class="product-ingredients">pepperoni, mushroom, mozarella</p>
            <p class="product-price">$14</p>
          </div>
          <button class="add-btn">+</button>
        </div>
        <div class="menu-item">
          <img
            class="product-image"
            src="assets/images/pizza.png"
            alt="Photo of the Pizza slice for the menu"
          />
          <div class="product-info">
            <h2 class="product-name">Pizza</h2>
            <p class="product-ingredients">pepperoni, mushroom, mozarella</p>
            <p class="product-price">$14</p>
          </div>
          <button class="add-btn">+</button>
        </div>
        <!-- js -->
      </div>
    </main>
    <footer>
      <h3>Your Order:</h3>
      <div class="orders">
        <div class="order">
          <p class="order-name">Pizza</p>
          <button class="remove-btn">remove</button>
          <p class="order-price">$14</p>
        </div>
        <div class="order">
          <p class="order-name">Pizza</p>
          <button class="remove-btn">remove</button>
          <p class="order-price">$14</p>
        </div>
        <div class="order">
          <p class="order-name">Pizza</p>
          <button class="remove-btn">remove</button>
          <p class="order-price">$14</p>
        </div>
      </div>
      <div class="checkout">
        <div class="total-price-info">
          <h4>Total Price:</h4>
          <p class="total-price">$14</p>
        </div>
        <button class="order-btn">Complete Order</button>
      </div>
    </footer>
    <script src="script.js" type="module"></script>
