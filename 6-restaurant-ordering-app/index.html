<!doctype html>
<html lang="en">
  <head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO Tags -->
    <meta
      name="description"
      content="Order delicious burgers, pizza, and drinks online with our fast and easy-to-use restaurant ordering app."
    />
    <meta
      name="keywords"
      content="restaurant ordering app, food delivery, online menu, burger, pizza, JavaScript app"
    />
    <meta name="author" content="Gayrat Rahmatullayev" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Restaurant Ordering App" />
    <meta
      property="og:description"
      content="Browse the menu, customize your cart, and order your favorite meals online."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Restaurant Ordering App" />
    <meta
      name="twitter:description"
      content="Browse the menu, customize your cart, and order your favorite meals online."
    />
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
    <!-- Title -->
    <title>Restaurant Ordering</title>
  </head>
  <body>
    <header>
      <h1 class="title">Harry's Dinner</h1>
      <p class="sub-title">The best burgers and pizzas in town.</p>
    </header>
    <main>
      <div class="menu">
        <!-- js -->

        <!-- js -->
      </div>
    </main>
    <footer>
      <h3>Your Order:</h3>
      <div class="orders">
        <div class="order">
          <p class="order-name">Pizza</p>
          <button class="remove-btn">remove</button>
          <p class="order-price">$14</p>
        </div>
        <div class="order">
          <p class="order-name">Pizza</p>
          <button class="remove-btn">remove</button>
          <p class="order-price">$14</p>
        </div>
        <div class="order">
          <p class="order-name">Pizza</p>
          <button class="remove-btn">remove</button>
          <p class="order-price">$14</p>
        </div>
      </div>
      <div class="checkout">
        <div class="total-price-info">
          <h4>Total Price:</h4>
          <p class="total-price">$14</p>
        </div>
        <button class="order-btn">Complete Order</button>
      </div>
    </footer>
    <div class="payment-modal hidden">
      <h1>Enter Card Details</h1>
      <form>
        <input
          placeholder="John Doe"
          type="text"
          id="card-holder-f-name"
          name="card-holder-f-name"
          required
        />
        <input
          placeholder="1234 5678 9000 0000"
          type="text"
          id="card-number"
          name="card-number"
          inputmode="numeric"
          minlength="15"
          maxlength="19"
          required
        />
        <input
          placeholder="123"
          type="text"
          id="cvv-number"
          name="cvv-number"
          minlength="3"
          maxlength="3"
          required
        />
        <input
          type="month"
          id="card-expiration"
          name="card-expiration"
          required
        />
        <input type="button" value="Place Order" />
      </form>
    </div>
    <script src="script.js" type="module"></script>
  </body>
</html>
